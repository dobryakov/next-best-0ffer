name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        run: docker compose build api workers ml-pipeline

      - name: Start infrastructure
        run: docker compose up -d postgres redis feast

      - name: Run API tests
        run: docker compose run --rm api pytest

      - name: Run contract tests
        run: docker compose run --rm api pytest -m contract

      - name: Run worker tests
        run: docker compose run --rm workers pytest

      - name: Run performance smoke (Locust)
        run: >
          docker compose --profile perf run --rm perf
          --headless --users 10 --spawn-rate 3 --run-time 2m

      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans --volumes

