[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbo-api"
version = "0.1.0"
description = "FastAPI сервис Next Best Offer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
  "email-validator>=2.1.0,<3.0",
  "SQLAlchemy>=2.0.30,<3.0",
  "psycopg[binary]>=3.2.0,<4.0",
  "alembic>=1.13.2,<2.0",
  "python-dotenv>=1.0.1,<2.0",
  "redis>=5.0.0,<6.0",
  "celery>=5.4.0,<6.0",
  "structlog>=24.1.0,<25.0",
  "prometheus-client>=0.20.0,<1.0",
  "opentelemetry-api>=1.25.0,<2.0",
  "opentelemetry-sdk>=1.25.0,<2.0",
  "httpx>=0.27.0,<0.28",
  "orjson>=3.10.0,<4.0",
  "python-json-logger>=2.0.7,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.23.0,<1.0",
  "pytest-cov>=4.1.0,<5.0",
  "ruff>=0.6.0,<1.0",
  "mypy>=1.11.0,<2.0",
  "types-redis>=4.6.0,<5.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "domain", "infra"]

[tool.pytest.ini_options]
addopts = "--strict-markers --maxfail=1"
testpaths = ["tests"]
markers = [
  "contract: контрактные тесты API",
  "integration: интеграционные сценарии",
]

[tool.coverage.run]
branch = true
source = ["app", "domain", "infra"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]

