[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbo-workers"
version = "0.1.0"
description = "Celery воркеры и ML pipelines для Next Best Offer"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4.0,<6.0",
  "redis>=5.0.0,<6.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
  "structlog>=24.1.0,<25.0",
  "aiohttp>=3.9.0,<4.0",
  "feast>=0.35.0,<0.36",
  "numpy>=1.26.0,<2.0",
  "pandas>=2.2.0,<3.0",
  "scikit-learn>=1.5.0,<2.0",
  "lightgbm>=4.3.0,<5.0",
  "implicit>=0.7.0,<1.0",
  "opentelemetry-api>=1.25.0,<2.0",
  "opentelemetry-sdk>=1.25.0,<2.0",
  "prometheus-client>=0.20.0,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-cov>=4.1.0,<5.0",
  "ruff>=0.6.0,<1.0",
  "mypy>=1.11.0,<2.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["tasks", "pipelines"]

[tool.pytest.ini_options]
addopts = "--strict-markers --maxfail=1"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tasks", "pipelines"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]

