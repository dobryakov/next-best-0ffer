[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbo-ml"
version = "0.1.0"
description = "ML pipelines and offline training jobs for Next Best Offer"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
  "structlog>=24.1.0,<25.0",
  "numpy>=1.24.4,<2.0",
  "scipy>=1.13.0,<2.0",
  "pandas>=1.5.3,<3.0",
  "pyarrow>=17.0.0,<18.0",
  "scikit-learn>=1.5.0,<2.0",
  "lightgbm>=4.3.0,<5.0",
  "implicit>=0.7.0,<1.0",
  "feast>=0.40.0,<0.41",
  "mlflow>=2.15.0,<3.0",
  "prefect>=2.20.0,<3.0",
  "sqlalchemy>=2.0.30,<3.0",
  "psycopg[binary]>=3.2.0,<4.0",
  "redis>=5.0.0,<6.0",
  "python-dotenv>=1.0.1,<2.0",
  "prometheus-client>=0.20.0,<1.0",
  "opentelemetry-api>=1.25.0,<2.0",
  "opentelemetry-sdk>=1.25.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-cov>=4.1.0,<5.0",
  "ruff>=0.6.0,<1.0",
  "mypy>=1.11.0,<2.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["training", "evaluation", "registry", "pipelines"]

[tool.pytest.ini_options]
addopts = "--strict-markers --maxfail=1"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["training", "evaluation", "registry", "pipelines"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]

